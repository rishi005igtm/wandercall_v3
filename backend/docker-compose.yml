# ═══════════════════════════════════════════════════════════════════════════════
# Wandercall Backend — Development Compose
#
# PURPOSE: Local development only. Runs the app with local Postgres + Redis.
# USAGE:   docker compose up
#          docker compose up --build   (force rebuild after code changes)
#
# DO NOT use this file on EC2 / production.
# For production deployment, use: docker-compose.prod.yml
# ═══════════════════════════════════════════════════════════════════════════════

services:
  # ── Application ─────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: wandercall-backend:dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    # These override .env values so the app connects to the local Docker services.
    # In dev, DB_HOST and REDIS_HOST must point to the Docker service names,
    # not to localhost or any cloud host.
    environment:
      NODE_ENV: development
      DB_HOST: postgres
      DB_SSL: "false"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      # Clear REDIS_URL so the app uses host/port, not a URL pointing elsewhere
      REDIS_URL: ""
    ports:
      - "${PORT:-5000}:5000"
    networks:
      - wandercall-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-wandercall}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - wandercall-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-wandercall}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # ── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # IMPORTANT: --requirepass with an empty string is a Redis fatal error.
    # We use a fixed command without --requirepass for local dev (no password needed).
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 60 1000
      --appendonly yes
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    networks:
      - wandercall-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  wandercall-net:
    driver: bridge
