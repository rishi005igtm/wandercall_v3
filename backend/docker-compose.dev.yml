# ═══════════════════════════════════════════════════════════════════════════════
# Wandercall Backend — Hot-Reload Development Override
#
# PURPOSE: Extends docker-compose.yml for live TypeScript reloading.
#          Mounts src/ into the container so changes reflect without rebuild.
#
# USAGE:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# NOTE: This is optional. Most developers run `npm run start:dev` directly
#       without Docker for the fastest feedback loop.
# ═══════════════════════════════════════════════════════════════════════════════

services:
  api:
    # Override to use the full builder stage which has all devDependencies
    build:
      target: builder
    image: wandercall-backend:dev-watch
    # Override the production CMD with the NestJS watch command
    command: ["node", "node_modules/.bin/nest", "start", "--watch"]
    environment:
      NODE_ENV: development
    volumes:
      # Mount source for live reload — node_modules stays in the container layer
      - ./src:/app/src:delegated
      - ./nest-cli.json:/app/nest-cli.json:ro
      - ./tsconfig.json:/app/tsconfig.json:ro
      - ./tsconfig.build.json:/app/tsconfig.build.json:ro
    # Faster healthcheck start in dev
    healthcheck:
      start_period: 30s
