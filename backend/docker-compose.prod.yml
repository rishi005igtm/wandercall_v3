# ═══════════════════════════════════════════════════════════════════════════════
# Wandercall Backend — Production Compose (EC2 / Docker Hub)
#
# PURPOSE: Production deployment on EC2.
#          Pulls pre-built image from Docker Hub.
#          Connects to Azure PostgreSQL and Upstash Redis — NO local services.
#
# USAGE (manual):
#   docker compose -f docker-compose.prod.yml up -d
#
# USAGE (GitHub Actions — automated):
#   Triggered automatically on push to main branch.
#   GitHub Actions builds the image, pushes to Docker Hub,
#   then SSHs into EC2 and runs this file.
#
# REQUIREMENTS:
#   - .env file must exist on EC2 at the same directory as this file.
#   - .env must contain all required variables (see .env.example).
#   - DB_HOST must point to Azure PostgreSQL host.
#   - REDIS_URL must point to Upstash Redis URL (rediss://...).
#   - DOCKER_IMAGE must be set, e.g.: yourdockerhubuser/wandercall-backend:latest
#
# NEVER run docker-compose.yml (dev file) on EC2.
# ═══════════════════════════════════════════════════════════════════════════════

services:
  api:
    # Image is set via the DOCKER_IMAGE environment variable.
    # GitHub Actions exports it directly into the SSH session.
    # For manual runs on EC2, either:
    #   export DOCKER_IMAGE=anmol8733/wandercall-backend:latest && docker compose -f docker-compose.prod.yml up -d
    #   OR add DOCKER_IMAGE=anmol8733/wandercall-backend:latest to your .env file.
    image: ${DOCKER_IMAGE:-anmol8733/wandercall-backend:latest}
    restart: always
    # No depends_on — there are no local services to wait for.
    # Azure Postgres and Upstash Redis are always-on external services.
    env_file:
      - .env
    # These environment keys are intentionally NOT set here.
    # DB_HOST, REDIS_URL, and all secrets come exclusively from .env.
    # This ensures the image is reusable and environment-agnostic.
    environment:
      NODE_ENV: production
    ports:
      - "${PORT:-5000}:5000"
    networks:
      - wandercall-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

# ── Networks ──────────────────────────────────────────────────────────────────
# No volumes needed — no local database or Redis.
networks:
  wandercall-net:
    driver: bridge
